[package]
name = "tailscale-tunnel-manager"
version = "0.1.2"
edition = "2021"
description = "TCP tunnel manager for Tailscale containers"
license = "GPL-2.0-only"
repository = "https://github.com/jackskelt/tailscale-discloud"
homepage = "https://github.com/jackskelt/tailscale-discloud"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["fs"] }
hyper = { version = "1.9", features = ["client", "http1"] }
hyperlocal = "0.9"
hyper-util = { version = "0.1", features = ["client", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
